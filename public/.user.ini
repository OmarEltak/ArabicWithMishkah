; Per-directory PHP overrides for the my-lawyer Laravel app.
;
; In-PHP cosine over the 33K-chunk eastlaws corpus needs more than the 128M
; default. The real fix is Postgres + pgvector (push top-K to SQL via the
; `<=>` operator) but until that's flipped on, this keeps the public site
; from OOMing whenever a draft loads the SA profile + lookup_law tool round.
;
; PHP-FPM picks .user.ini up automatically per directory (5-min recheck
; default). For a dev/Herd setup this is the lowest-friction fix.
memory_limit = 512M

; Drafting flow: LLM round-trip + lookup_law tool call + a follow-up
; generation can comfortably exceed PHP's default 30s. We're synchronous
; for now (streaming-on-the-server with curl), so bump the cap. 180s is
; a generous ceiling that still kills genuinely-stuck requests.
max_execution_time = 180
